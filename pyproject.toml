[project]
name = "curlbook"
version = "0.1.0"
description = "Plain-text .http/YAML request collections with environments, chaining and assertions, runnable from the terminal and CI, with a Postman collection importer. For people who want a minimal Postman alternative that lives in git."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["curlbook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
